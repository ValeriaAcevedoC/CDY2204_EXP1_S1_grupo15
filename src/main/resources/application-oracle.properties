## Oracle Cloud Autonomous DB configuration
## Copy this file to production and fill the placeholders or set the values via environment variables.

## Use a TNS alias defined in tnsnames.ora that comes with the wallet.
# Example TNS alias from tnsnames.ora: g6a6c62a1fd909d_learningplatform_tp
spring.datasource.url=jdbc:oracle:thin:@<TNS_ALIAS>

# Credentials - DO NOT commit real credentials. Prefer environment variables or secret manager.
spring.datasource.username=${ORACLE_DB_USER:your_user}
spring.datasource.password=${ORACLE_DB_PASS:your_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Recommended: do not use ddl-auto in production. Use migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=validate

# Optionally set dialect. If you face ClassNotFound issues, remove this property and let Hibernate detect.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect

# Oracle Wallet (TNS_ADMIN) - point to the directory that contains cwallet.sso, tnsnames.ora, sqlnet.ora
# Use absolute path for JVM property or environment variable. Example for project folder:
#   -Doracle.net.tns_admin=/absolute/path/to/project/src/main/resources/wallet
# or set environment variable TNS_ADMIN

# Approach 1: provide TNS_ADMIN to the driver via Hikari data-source-properties
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${TNS_ADMIN:/path/to/wallet}

# Approach 2 (alternative): pass JVM argument when starting the JVM
# java -Doracle.net.tns_admin=/absolute/path/to/wallet -jar target/app.jar

# Connection testing and troubleshooting notes:
# - Verify the TNS alias exists in the shipped tnsnames.ora inside the wallet folder.
# - If you get ORA-12514 or similar, confirm the service name in tnsnames.ora and that the wallet
#   is the correct wallet for your Autonomous DB region/instance.
# - Use SQLcl or SQL*Plus with the wallet to validate connectivity before running the app.

# Security recommendations:
# - Do NOT store cleartext credentials in source control. Use environment variables or a secret manager.
# - Limit wallet files access to the application user and avoid committing the wallet to git.

# Example run (PowerShell):
# $env:ORACLE_DB_USER='ADMIN'
# $env:ORACLE_DB_PASS='StrongPassword'
# $env:TNS_ADMIN='C:\full\path\to\project\src\main\resources\wallet'
# .\mvnw.cmd -Dspring-boot.run.profiles=oracle spring-boot:run

# Example run (java -jar):
# java -Doracle.net.tns_admin="C:\full\path\to\wallet" -jar target/CloudNative_s1-0.0.1-SNAPSHOT.jar
